general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    path = ~/.config/hypr/images/CuteAru.png
    blur_size = 5
    blur_passes = 3
    brightness = 0.7
}

input-field {
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    rounding = -1
    outer_color = rgb(30, 30, 46)
    inner_color = rgba(49, 50, 68, 0.7)
    font_color = rgb(205, 214, 244)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -100
    halign = center
    valign = center
}

image {
    path = /var/lib/AccountsService/icons/$USER
    size = 150
    border_size = 4
    border_color = rgb(137, 180, 250)
    rounding = -1
    halign = center
    valign = center
    position = 0, 100
}

label {
    text = $USER
    color = rgb(205, 214, 244)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    halign = center
    valign = center
    position = 0, -40
    shadow_passes = 3
    shadow_size = 6
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = rgb(205, 214, 244)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = bottom
    position = -50, 110
    shadow_passes = 3
    shadow_size = 6
}

label {
    text = cmd[update:60000] date +"%A, %B %d, %Y"
    color = rgb(186, 194, 222)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = bottom
    position = -50, 60
    shadow_passes = 3
    shadow_size = 6
}

label {
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '?')%"
    color = rgb(249, 226, 175)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    halign = left
    valign = bottom
    position = 50, 60
    shadow_passes = 3
    shadow_size = 6
}
